<div class="relative w-full max-w-sm h-[500px] mx-auto perspective-1000 flex items-center justify-center">
  <div class="absolute inset-0 flex items-center justify-center text-gray-500">스택이 없습니다.</div>

  @for (profile of stacks(); track profile.id; let i = $index) {
    <div
      class="absolute inset-0 w-full h-full rounded-3xl shadow-2xl overflow-hidden bg-white origin-bottom transition-transform duration-100 ease-out select-none touch-none"
      [style.z-index]="visibleStacks().length - i"
      [style.transform]="getCardTransform(i)"
      [class.cursor-grab]="i === 0"
      (mousedown)="i === 0 ? startDrag($event) : null"
      (touchstart)="i === 0 ? startDrag($event) : null">
      <img [src]="profile.img" class="w-full h-full object-cover pointer-events-none" />

      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>

      <div class="absolute bottom-0 left-0 p-6 text-white w-full">
        <h2 class="text-3xl font-bold">{{ profile.name }}, {{ profile.age }}</h2>
        <p class="opacity-80">Software Engineer</p>
      </div>

      @if (i === 0 && isDragging()) {
        <div
          class="absolute top-8 left-8 border-4 border-green-500 text-green-500 font-black text-4xl px-4 py-2 rounded-lg transform -rotate-12 opacity-0 transition-opacity"
          [style.opacity]="likeOpacity()">
          LIKE
        </div>
        <div
          class="absolute top-8 right-8 border-4 border-red-500 text-red-500 font-black text-4xl px-4 py-2 rounded-lg transform rotate-12 opacity-0 transition-opacity"
          [style.opacity]="nopeOpacity()">
          NOPE
        </div>
      }
    </div>
  }
</div>
