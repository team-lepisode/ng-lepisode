@if (type() === 'bounce') {
  <button [class]="class()" class="cursor-pointer border-none" (click)="toggle()">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="transition-colors duration-300"
      [ngClass]="{
        'fill-gray-300 text-gray-300': !value(),
        'fill-red-500 text-red-500 animate-burst': value(),
      }">
      <path
        d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
    </svg>
  </button>
} @else {
  <button [class]="class()" class="relative cursor-pointer focus:outline-none" (click)="toggle()">
    <div
      class="absolute inset-0 transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
      [ngClass]="{
        'text-gray-300 -translate-x-2 -rotate-12': !value(),
        'text-red-500 translate-x-0 rotate-0': value(),
      }"
      style="clip-path: inset(0 50% 0 0)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
        <path
          d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
    </div>

    <div
      class="absolute inset-0 transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
      [ngClass]="{
        'text-gray-400 translate-x-2 rotate-12': !value(),
        'text-red-500 translate-x-0 rotate-0': value(),
      }"
      style="clip-path: inset(0 0 0 50%)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
        <path
          d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
      </svg>
    </div>
  </button>
}
