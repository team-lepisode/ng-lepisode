<div class="flex flex-col items-center gap-4 relative select-none">
  <div class="relative w-48 h-14 group">
    <button
      class="relative w-full h-full overflow-hidden rounded-full font-bold transition-transform active:scale-95 shadow-xl flex items-center justify-center z-10 outline-none"
      [class.bg-gray-900]="true"
      [class.text-white]="true"
      (mousedown)="startHold()"
      (mouseup)="cancelHold()"
      (mouseleave)="cancelHold()"
      (touchstart)="startHold()"
      (touchend)="cancelHold()">
      @if (showFill()) {
        <div
          class="absolute inset-0 bg-primary/90 origin-left transition-transform ease-linear"
          [style.transform]="'scaleX(' + progress() + ')'"
          [style.transition-duration]="transitionDuration()"></div>
      }

      <div class="relative z-20 flex items-center justify-center gap-2">
        @if (completed()) {
          <span class="flex items-center gap-1 animate-pulse"> Done! 🎉 </span>
        } @else {
          <span>
            <ng-content />
          </span>
        }
      </div>
    </button>

    @if (showStroke()) {
      <svg class="absolute inset-0 w-full h-full z-30 pointer-events-none overflow-visible" viewBox="0 0 192 56">
        <rect
          x="1.5"
          y="1.5"
          width="189"
          height="53"
          rx="26.5"
          ry="26.5"
          fill="none"
          stroke="#ffffff"
          stroke-width="1"
          stroke-opacity="0.1" />

        <rect
          x="1.5"
          y="1.5"
          width="189"
          height="53"
          rx="26.5"
          ry="26.5"
          fill="none"
          stroke-width="3"
          stroke-linecap="round"
          class="stroke-primary transition-[stroke-dashoffset] ease-linear drop-shadow-[0_0_6px_rgba(34,197,94,0.6)]"
          [style.stroke-dasharray]="pathLength"
          [style.stroke-dashoffset]="currentOffset()"
          [style.transition-duration]="transitionDuration()" />
      </svg>
    }
  </div>

  <p class="text-xs text-gray-500 h-4 transition-opacity font-mono" [class.opacity-0]="!isHolding() || completed()">
    {{ timeLeft() }}s
  </p>
</div>
