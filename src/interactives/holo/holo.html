<div
  class="perspective-container flex justify-center items-center py-10"
  (mouseleave)="resetCard()"
  (mousemove)="rotateCard($event)">
  <div
    class="card-root relative w-[320px] h-[480px] overflow-hidden rounded-[5%] transition-transform duration-200 ease-out will-change-transform shadow-2xl"
    [style.transform]="transformStyle()">
    <div class="absolute inset-0 rounded-[4.5%] overflow-hidden bg-black z-0">
      <img [src]="src()" class="w-full h-full object-cover opacity-90" alt="image" />
    </div>

    <div
      class="absolute inset-0 rounded-[4.5%] z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none mix-blend-color-dodge bg-no-repeat bg-center bg-cover"
      [style.background-image]="holoGradient()"
      [style.background-position]="holoPosition()"
      [style.filter]="'brightness(1.2) contrast(1.5) saturate(1.5)'"></div>

    <div
      class="absolute inset-0 rounded-[4.5%] z-20 opacity-0 group-hover:opacity-60 transition-opacity duration-300 pointer-events-none mix-blend-hard-light bg-repeat"
      style="background-image: url('https://grainy-gradients.vercel.app/noise.svg'); background-size: 30%"></div>

    <div
      class="absolute inset-0 rounded-[4.5%] z-30 pointer-events-none mix-blend-overlay transition-opacity duration-300"
      [style.opacity]="glareOpacity()"
      [style.background]="glareGradient()"></div>

    <div class="bg-white absolute inset-0 w-full h-full flex items-center justify-center">
      <img src="https://lepisode.kr/assets/homepage_logo_pill.svg" />
    </div>

    <ng-content />

    <div class="absolute inset-0 rounded-[5%] border-[8px] border-gray-800/80 z-50 pointer-events-none"></div>
  </div>
</div>
