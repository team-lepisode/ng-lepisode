<div class="kanban-container flex gap-4 h-full overflow-x-auto p-2">
  @for (column of columns(); track column.value) {
    <div
      class="kanban-column flex flex-col min-w-[280px] max-w-[320px] bg-base-200 rounded-box"
    >
      <div
        class="kanban-column-header flex items-center gap-2 p-3 border-b border-base-content/10"
      >
        <span
          class="size-3 rounded-full"
          [style.backgroundColor]="getColumnColor(column.color)"
        ></span>
        <span class="font-medium">{{ column.label }}</span>
        <span class="badge badge-soft badge-sm ml-auto">
          {{ column.cards.length }}
        </span>
      </div>

      <div
        class="kanban-column-body flex-1 overflow-y-auto p-2"
        cdkDropList
        [cdkDropListData]="column.cards"
        [cdkDropListConnectedTo]="columnIds()"
        (cdkDropListDropped)="onCardDrop($event, column.value)"
      >
        @for (card of column.cards; track card.id) {
          <app-kanban-card
            cdkDrag
            [cdkDragData]="card"
            [row]="card"
            (cardClick)="onCardClick($event)"
          />
        }

        @if (!column.cards.length) {
          <div class="text-center text-base-content/50 py-8">
            {{ 'no_cards' | translate }}
          </div>
        }
      </div>
    </div>
  }
</div>
