<div
  class="file-uploader"
  [class.drag-over]="isDragOver()"
  [class.image-mode]="isImageMode()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)">
  <!-- 업로드 영역 -->
  @if (!isMaxReached()) {
    <label class="upload-area" [class.uploading]="isUploading()">
      <input
        type="file"
        [accept]="accept()"
        [multiple]="maxFiles() > 1"
        (change)="onFileSelect($event)"
        class="hidden" />

      @if (isUploading()) {
        <span class="loading loading-spinner loading-md text-primary"></span>
        <span class="upload-text">업로드 중...</span>
      } @else {
        <div class="upload-icon-wrapper">
          <span
            class="icon-[lucide--upload-cloud] text-4xl text-base-content/30 group-hover:text-primary transition-colors"></span>
        </div>
        <div class="upload-info">
          <span class="upload-text font-medium">파일을 드래그하거나 클릭하세요</span>
          <span class="upload-hint">
            @if (isImageMode()) {
              이미지 파일 (최대 {{ maxFiles() }}개)
            } @else {
              모든 파일 (최대 {{ maxFiles() }}개)
            }
          </span>
        </div>
      }
    </label>
  }

  <!-- 업로드된 파일 미리보기 -->
  @if (normalizedValue().length > 0) {
    <div class="file-list" [class.image-grid]="isImageMode()" [class.single-mode]="isSingleMode()">
      @for (url of normalizedValue(); track url; let i = $index) {
        <div class="file-item" [class.image-item]="isImageMode()">
          @if (isImageMode()) {
            <img [src]="url" alt="Uploaded image" class="image-preview" />
          } @else {
            <div class="file-info">
              <span class="icon-[lucide--file-text] text-xl text-primary/60"></span>
              <span class="file-name text-sm font-medium">{{ getFileName(url) }}</span>
            </div>
          }
          <button type="button" class="btn btn-circle btn-xs btn-error remove-btn shadow-sm" (click)="removeFile(i)">
            <span class="icon-[lucide--x] text-xs"></span>
          </button>
        </div>
      }
    </div>
  }
</div>
